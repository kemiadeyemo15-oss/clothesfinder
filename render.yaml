# Render blueprint: managed Postgres (with pgvector) + the FastAPI service.
# Push this repo, point Render at it, set the secrets in the dashboard.
# Frontend deploys separately on Vercel (see README).
databases:
  - name: clothesfinder-db
    databaseName: clothesfinder
    user: clothesfinder
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: clothesfinder-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    preDeployCommand: alembic upgrade head
    envVars:
      - key: CF_ENV
        value: prod
      - key: CF_REPO_BACKEND
        value: postgres
      - key: CF_DATABASE_URL
        fromDatabase:
          name: clothesfinder-db
          property: connectionString
      - key: CF_EMBEDDER
        value: stub          # set to "lykdat" once CF_LYKDAT_API_KEY is in
      - key: CF_INVENTORY
        value: seed          # set to "shopping_api" with key + url
      - key: CF_LYKDAT_API_KEY
        sync: false
      - key: CF_SHOPPING_API_KEY
        sync: false
      - key: CF_SHOPPING_API_URL
        sync: false
      - key: CF_CORS_ORIGINS
        sync: false          # e.g. ["https://clothesfinder.vercel.app"]
