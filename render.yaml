# Render blueprint — minimal, works on first deploy.
#
# Ships the API in in-memory + seed + stub mode: it returns real ranked
# results immediately, with no database to populate. The Postgres/pgvector
# path (see infra/docker-compose.yml and the README) is what you move to when
# you wire real inventory + embeddings — at that point add a Render Postgres
# and set CF_REPO_BACKEND=postgres + the keys below.
#
# Frontend deploys separately on Vercel (see README).
services:
  - type: web
    name: clothesfinder-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: CF_ENV
        value: prod
      - key: CF_REPO_BACKEND
        value: memory          # flip to "postgres" once you add a DB + ingest
      - key: CF_EMBEDDER
        value: stub            # flip to "lykdat" once CF_LYKDAT_API_KEY is set
      - key: CF_INVENTORY
        value: seed            # flip to "shopping_api" with key + url
      - key: CF_QUERY_PARSER
        value: rules           # flip to "llm" with CF_LLM_API_KEY
      - key: CF_LYKDAT_API_KEY
        sync: false            # set in dashboard when going real
      - key: CF_SHOPPING_API_KEY
        sync: false
      - key: CF_SHOPPING_API_URL
        sync: false
      - key: CF_CORS_ORIGINS
        sync: false            # set to ["https://<your>.vercel.app"] after Vercel
